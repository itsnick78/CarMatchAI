services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: carmatch-postgres
    environment:
      - 'POSTGRES_DB=carmatch'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=carmatch_user'
      - 'TZ=UTC'
      - 'PGTZ=UTC'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carmatch_user -d carmatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:7-alpine'
    container_name: carmatch-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: 'ollama/ollama:latest'
    container_name: carmatch-ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot job: pulls the chat model into the ollama_data volume on first
  # startup, then exits. Without this, the app's first AI request would fail
  # because no model has been downloaded into the fresh Ollama container yet.
  ollama-pull:
    image: 'ollama/ollama:latest'
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c", "OLLAMA_HOST=ollama:11434 ollama pull llama3.2:1b"]
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  ollama_data:
