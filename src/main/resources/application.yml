spring:
  application:
    name: CarMatchAI
  
  # Database configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/carmatch
    username: carmatch_user
    password: secret
    driver-class-name: org.postgresql.Driver
  
  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  # Redis configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis

  # Spring AI / Ollama configuration
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:llama3.2:1b}
        options:
          temperature: 0.2
          num-predict: 400

# CarMatchAI-specific feature flags
carmatch:
  ai:
    # AI-generated recommendation explanations degrade to the template-based
    # ones in RecommendationService whenever this is off or Ollama is
    # unreachable/slow - see AiExplanationService.
    explanations-enabled: ${AI_EXPLANATIONS_ENABLED:true}

# Server configuration
server:
  port: 8081
  servlet:
    context-path: /

# Logging configuration
logging:
  level:
    ai.carmatch: INFO
    org.springframework.cache: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.jdbc.datasource.init.ScriptUtils: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# App security configuration
app:
  jwt:
    # Override with a real secret via the JWT_SECRET env var outside local
    # dev - never rely on the fallback below in a deployed environment,
    # since anyone who reads this file could otherwise forge tokens.
    secret: ${JWT_SECRET:flG8cyEcArt9e7xDN6XPWYNRSCZSKT8M9ytxpYr+4jSpPp6LkfIYFWUChcrHpWTj}
    expirationMs: 3600000 # 1 hour
  cors:
    # Comma-separated allowed origin patterns for the CORS filter. No "*"
    # here on purpose - combined with allowCredentials(true) (needed for the
    # AUTH_TOKEN cookie) a wildcard would let any site read authenticated
    # responses. Override via CORS_ALLOWED_ORIGINS for real deployments.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  cookie:
    # Must be true once the app is served over HTTPS.
    secure: ${COOKIE_SECURE:false}

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
